<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://rerofya.github.io/resources/flower.css">
    <title>tererofyac</title>
    <style>
        #flower-container .flower__leaf,
        #flower-container .flower__petal,
        #flower-container .flower__leaf--1,
        #flower-container .flower__leaf--2,
        #flower-container .flower__leaf--3,
        #flower-container .flower__leaf--4,
        #flower-container .flower__leaf--5,
        #flower-container .flower__leaf--6,
        #flower-container .flower__leaf--7,
        #flower-container .flower__leaf--8 {
            background-image: linear-gradient(to top, #d32f2f, #ff5252) !important;
        }

        #flower-container .flower__line,
        #flower-container .flower__line__leaf,
        #flower-container .flower__line__leaf--1,
        #flower-container .flower__line__leaf--2,
        #flower-container .flower__line__leaf--3,
        #flower-container .flower__line__leaf--4,
        #flower-container .flower__line__leaf--5,
        #flower-container .flower__line__leaf--6,
        #flower-container .flower__grass__leaf {
            background-image: linear-gradient(to top, #2e7d32, #4caf50) !important;
            background-color: #4caf50 !important;
        }
    </style>
</head>
<body>

    <div id="flower-container"></div>

    <script src="https://rerofya.github.io/resources/flower.js"></script>
</body>
</html>
